<!doctype html>
<html lang="fi" class="splashing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f1e5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pump Club">
<title>Pump Club</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=0.5.2">
<link rel="icon" href="icon-192.png?v=0.5.2">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Latausnäyttö: näkyy heti, poistetaan kun ensimmäinen näkymä on valmis (hideSplash app.js:ssä) -->
<div id="splash" role="status" aria-label="Ladataan Pump Club">
  <div class="sp-rays"></div>
  <div class="sp-mark" aria-hidden="true">
    <svg class="sp-bar" viewBox="0 0 512 90"><g fill="#111"><rect x="40" y="39" width="432" height="12" rx="3"/><rect x="62" y="10" width="26" height="70" rx="5"/><rect x="92" y="18" width="20" height="54" rx="4"/><rect x="40" y="30" width="18" height="30" rx="3"/><rect x="424" y="10" width="26" height="70" rx="5"/><rect x="400" y="18" width="20" height="54" rx="4"/><rect x="454" y="30" width="18" height="30" rx="3"/></g><g fill="#f6f1e5"><rect x="69" y="16" width="5" height="58" rx="2"/><rect x="431" y="16" width="5" height="58" rx="2"/></g></svg>
    <div class="sp-word"><span class="sp-pump">PUMP</span><span class="sp-club">CLUB</span></div>
  </div>
</div>
<header id="topbar">
  <span id="title">Pump Club</span>
  <span id="sync" class="sync" title="Tallennuksen tila"></span>
</header>
<main id="view"><p class="muted center">Ladataan…</p></main>
<nav id="tabs" class="glass" hidden>
  <button data-tab="tanaan" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg><span>Tänään</span></button>
  <button data-tab="ohjelma"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Ohjelma</span></button>
  <button data-tab="historia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5M12 7.5V12l3 2"/></svg><span>Historia</span></button>
  <button data-tab="paino"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><path d="M8 9.5h8l-1 5.5h-6zM10 15l-.6 5.5M14 15l.6 5.5M8 9.5 5.5 13M16 9.5l2.5 3.5"/></svg><span>Keho</span></button>
  <button data-tab="vienti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M7.5 9.5 12 14l4.5-4.5M5 19h14"/></svg><span>Data</span></button>
</nav>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
